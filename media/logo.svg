<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sovereign Agent</title>
  <desc id="desc">Autonomous, offline AI coding assistant with local sovereignty and privacy.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="60%" stop-color="#0f1217"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>

    <!-- Indigo-to-Cyan Vivid Neon Gradient -->
    <linearGradient id="primaryGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00d2b4"/>
    </linearGradient>

    <!-- Cyan Glow Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00d2b4"/>
    </linearGradient>

    <!-- Inner Core Radiant Gradient -->
    <linearGradient id="coreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#262c36" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow & Soft Shadow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#subtleShadow)"/>

  <!-- Subtle Inner Ambient Mesh Glow -->
  <circle cx="256" cy="190" r="140" fill="#6366f1" opacity="0.12" filter="url(#coreGlow)"/>
  <circle cx="256" cy="330" r="110" fill="#00d2b4" opacity="0.08" filter="url(#coreGlow)"/>

  <!-- Sovereign Geometric Shield & Neural Citadel -->
  <g filter="url(#subtleShadow)">
    <!-- Outer Shield Crest -->
    <path d="M 256,92 
             L 378,146 
             C 382,236 364,324 256,396 
             C 148,324 130,236 134,146 
             Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="22" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Left Code Chevron < -->
    <path d="M 226,192 
             L 174,244 
             L 226,296" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Code Chevron > -->
    <path d="M 286,192 
             L 338,244 
             L 286,296" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Autonomous Core: Slash & Star -->
    <line x1="270" y1="184" x2="242" y2="304" 
          stroke="#818cf8" 
          stroke-width="14" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <polygon points="256,220 274,244 256,268 238,244" 
             fill="url(#coreGrad)" 
             filter="url(#coreGlow)"/>

    <!-- Apex Crown / Orbit Nodes -->
    <circle cx="256" cy="92" r="11" fill="#818cf8"/>
    <circle cx="378" cy="146" r="8" fill="#6366f1"/>
    <circle cx="134" cy="146" r="8" fill="#818cf8"/>
    <circle cx="256" cy="396" r="10" fill="#00d2b4"/>
  </g>
</svg>
